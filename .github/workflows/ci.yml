name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests and package
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Frontend clean install, tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable candidate image
        run: docker build -f backend/Dockerfile -t xiaohezi:${{ github.sha }} .
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: xiaohezi:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
