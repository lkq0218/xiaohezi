groups:
  - name: xiaohezi-ai
    rules:
      - alert: LlmHighFailureRate
        expr: sum(rate(xiaohezi_llm_requests_total{result="failure"}[5m])) / clamp_min(sum(rate(xiaohezi_llm_requests_total[5m])), 0.001) > 0.10
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "LLM failure rate exceeds 10%" }
      - alert: LlmHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(xiaohezi_llm_latency_seconds_bucket[10m]))) > 15
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "LLM P95 latency exceeds 15 seconds" }
      - alert: LlmHourlyCostSpike
        expr: increase(xiaohezi_llm_estimated_cost_usd_total[1h]) > 1
        labels: { severity: warning }
        annotations: { summary: "Estimated LLM cost exceeds USD 1 per hour" }
