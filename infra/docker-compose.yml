services:
  app:
    image: ${APP_IMAGE:-xiaohezi:local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: infra
      MYSQL_URL: jdbc:mysql://mysql:3306/xiaohezi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-xiaohezi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: namesrv:9876
      APP_DEMO_USERNAME: ${APP_DEMO_USERNAME:-demo}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:?APP_DEMO_PASSWORD must be set}
      APP_DEMO_TOKEN: ${APP_DEMO_TOKEN:?APP_DEMO_TOKEN must be set}
      APP_SECURITY_MODE: ${APP_SECURITY_MODE:-demo}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/xiaohezi}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8080/realms/xiaohezi/protocol/openid-connect/certs}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: xiaohezi
      MYSQL_USER: ${MYSQL_USER:-xiaohezi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      XHZ_DEMO_USER_PASSWORD: ${KEYCLOAK_DEMO_USER_PASSWORD:?KEYCLOAK_DEMO_USER_PASSWORD must be set}
      XHZ_DEMO_ADMIN_PASSWORD: ${KEYCLOAK_DEMO_ADMIN_PASSWORD:?KEYCLOAK_DEMO_ADMIN_PASSWORD must be set}
    ports: ["${KEYCLOAK_PORT:-8180}:8080"]
    volumes:
      - ./keycloak/xiaohezi-realm.json:/opt/keycloak/data/import/xiaohezi-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep 'HTTP/1.1 200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      app:
        condition: service_healthy

  namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    ports: ["9876:9876"]

  broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker
    environment:
      NAMESRV_ADDR: namesrv:9876
    depends_on: [namesrv]
    ports: ["10909:10909", "10911:10911", "10912:10912"]

volumes:
  mysql-data:
  redis-data:
