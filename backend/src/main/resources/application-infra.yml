spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/xiaohezi}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/xiaohezi/protocol/openid-connect/certs}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/xiaohezi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
app:
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:true}
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: xiaohezi-producer
